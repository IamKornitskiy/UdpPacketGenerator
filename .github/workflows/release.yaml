name: Build and release

on:
  push:
    tags:
      - 'v*'   # запускать при тегах v1.0.0, v2.3.1 и т.д.

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_VERSION: 6.8.0
      BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia  # если нужны дополнительные модули Qt

      # ----- Linux: установка системных зависимостей -----
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev rpm

      # ----- Конфигурация CMake -----
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}

      # ----- Сборка -----
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # ----- Windows: упаковка в zip -----
      - name: Deploy and package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Copy-Item mainwindow.ui build/${{ env.BUILD_TYPE }}/
          windeployqt --release build/${{ env.BUILD_TYPE }}/UdpPacketGenerator.exe
          Compress-Archive -Path build/${{ env.BUILD_TYPE }}/* -DestinationPath UdpPacketGenerator-${{ github.ref_name }}-win64.zip

      # ----- Linux: подготовка для linuxdeployqt -----
      - name: Prepare deploy directory (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir deploy_dir
          cp build/UdpPacketGenerator deploy_dir/
          cp mainwindow.ui deploy_dir/

      - name: Download linuxdeployqt
        if: runner.os == 'Linux'
        run: |
          wget -q "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      # ----- Linux: portable tar.gz -----
      - name: Create portable tar.gz
        if: runner.os == 'Linux'
        run: |
          ./linuxdeployqt-continuous-x86_64.AppImage deploy_dir/UdpPacketGenerator -verbose=1 -no-appimage
          tar -czf UdpPacketGenerator-${{ github.ref_name }}-linux-portable.tar.gz -C deploy_dir .
        shell: bash

      # ----- Linux: AppImage -----
      - name: Create AppImage
        if: runner.os == 'Linux'
        run: |
          ./linuxdeployqt-continuous-x86_64.AppImage deploy_dir/UdpPacketGenerator -appimage -verbose=1
          mv *.AppImage UdpPacketGenerator-${{ github.ref_name }}-x86_64.AppImage
        shell: bash

      # ----- Linux: deb и rpm через CPack -----
      - name: Build deb and rpm packages
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/build
        run: |
          cpack -G DEB -C ${{ env.BUILD_TYPE }}
          cpack -G RPM -C ${{ env.BUILD_TYPE }}

      # ----- Публикация всех артефактов -----
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UdpPacketGenerator-*-win64.zip
            UdpPacketGenerator-*-linux-portable.tar.gz
            UdpPacketGenerator-*.AppImage
            build/*.deb
            build/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}