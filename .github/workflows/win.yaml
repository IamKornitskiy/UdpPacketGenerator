name: Build Windows release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_VERSION: 6.8.2
      BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ''

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Deploy and package
        shell: powershell
        run: |
          mkdir deploy
          Copy-Item build\${{ env.BUILD_TYPE }}\UdpPacketGenerator.exe deploy\
          windeployqt deploy\UdpPacketGenerator.exe
          Compress-Archive -Path deploy\* -DestinationPath UdpPacketGenerator-${{ github.ref_name }}-win64.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: UdpPacketGenerator-*-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}